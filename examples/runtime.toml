# Paths are resolved relative to this file.
store_path = "../data/context.sqlite3"

[[endpoints]]
socket_path = "../run/pcp-symbiont.sock"
client_id = "host:symbiont-d"
client_type = "host"
client_name = "symbiont-d"
access_mode = "admin"
allowed_scopes = [
  "user:{identity_id}",
  "project:symbiont-d",
  "conversation:symbiont-d-main",
]
allow_cross_scope_derivation = true

[[endpoints]]
socket_path = "../run/pcp-codex-example.sock"
client_id = "codex:project-example"
client_type = "model_client"
client_name = "Codex project example"
access_mode = "read"
allowed_scopes = [
  "project:example",
  "conversation:example-main",
]

# Semantic maintenance is deliberately opt-in. The preferred provider is an
# independently authorized Infer Runtime consumer. A command provider remains
# available for local adapters.
#
# [maintenance]
# enabled = true
# mode = "observe" # default; use "apply" only after reviewing worker behavior
# state_path = "../data/maintenance-state.json"
# allowed_scopes = ["user:{identity_id}", "project:symbiont-d"]
# interval_seconds = 1800
# initial_delay_seconds = 300
# max_jobs_per_cycle = 2
# principal_id = "service:pcp-maintainer"
# principal_name = "PCP runtime maintainer"
#
# [maintenance.worker]
# provider = "infer_runtime"
# credential_file = "/absolute/path/to/pcp-runtime.token"
# timeout_seconds = 120
# summary_deployment_id = "ollama_qwen3_5_4b"
# reasoning_deployment_id = "codex_gpt_5_6_luna"
# relation_deployment_id = "codex_gpt_5_6_terra" # optional explicit escalation
# actor_id = "model:infer-runtime-maintenance"
# actor_type = "model"
#
# Command alternative:
# provider = "command"
# program = "/absolute/path/to/semantic-worker"
# args = []
#
# [maintenance.summary]
# enabled = true
# minimum_chars = 4000
# max_input_chars = 32000
# retry_after_seconds = 86400
# excluded_page_kinds = ["pcp_summary", "validity_assessment", "source_document"]
#
# [maintenance.packing]
# enabled = true
# max_pages = 8
# max_input_chars = 64000
# excluded_page_kinds = ["pcp_summary", "validity_assessment", "conversation_event"]
#
# [maintenance.relation]
# enabled = true
# candidate_window = 24
# routing_chars_per_page = 800
# retry_after_seconds = 86400
# excluded_page_kinds = ["pcp_summary", "summary_projection", "validity_assessment", "tombstone"]
