[package]
name = "pcp-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = "0.4"
infer-runtime-client = { git = "https://github.com/glenzli/infer-runtime.git", rev = "b490a61b2532c482bdf8774f71097df2a744146d" }
libc = "0.2"
pcp-client = { path = "../pcp-client" }
pcp-core = { path = "../pcp-core" }
pcp-rpc = { path = "../pcp-rpc" }
pcp-runtime = { path = "../pcp-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "pcp-console"
path = "src/main.rs"
