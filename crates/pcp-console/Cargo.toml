[package]
name = "pcp-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
axum = "0.8"
libc = "0.2"
pcp-client = { path = "../pcp-client" }
pcp-core = { path = "../pcp-core" }
pcp-rpc = { path = "../pcp-rpc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "pcp-console"
path = "src/main.rs"
