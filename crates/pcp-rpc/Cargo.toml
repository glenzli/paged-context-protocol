[package]
name = "pcp-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
libc = "0.2"
pcp-client = { path = "../pcp-client" }
pcp-core = { path = "../pcp-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "time",
] }
