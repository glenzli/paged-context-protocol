[package]
name = "pcp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
pcp-client = { path = "../pcp-client" }
pcp-core = { path = "../pcp-core" }
pcp-sqlite = { path = "../pcp-sqlite" }
pcp-store = { path = "../pcp-store" }
rmcp = { version = "3.1.0", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.1.0", default-features = false, features = [
    "client",
    "transport-async-rw",
] }
serde_json = "1.0"

[[bin]]
name = "pcp-mcp"
path = "src/main.rs"
