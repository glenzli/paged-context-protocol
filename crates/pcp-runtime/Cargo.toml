[package]
name = "pcp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
libc = "0.2"
pcp-client = { path = "../pcp-client" }
pcp-core = { path = "../pcp-core" }
pcp-rpc = { path = "../pcp-rpc" }
pcp-sqlite = { path = "../pcp-sqlite" }
pcp-store = { path = "../pcp-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1"
uuid = { version = "1.24", features = ["v4"] }

[[bin]]
name = "pcp-runtime"
path = "src/main.rs"
